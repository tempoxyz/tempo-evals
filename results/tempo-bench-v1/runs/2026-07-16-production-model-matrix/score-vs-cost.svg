  <g class="tick muted"><text x="55" y="614">0.00</text><text x="55" y="506.9">0.25</text><text x="55" y="399.7">0.50</text><text x="55" y="292.6">0.75</text><text x="55" y="185.4">1.00</text><text x="86" y="632">$0</text><text x="233.3" y="632">$10</text><text x="380.5" y="632">$20</text><text x="527.8" y="632">$30</text><text x="675.1" y="632">$40</text><text x="822.4" y="632">$50</text></g>
