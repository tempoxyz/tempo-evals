<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" role="img" aria-labelledby="title desc">
  <title id="title">Tempo Bench score / turns</title>
  <desc id="desc">Aggregate Tempo Bench score and model turns. Filled dots are Docs; hollow dots are MCP. Claude points are black and GPT points are warm gray.</desc>
  <style>
    .page { fill: #f3f3f3; } .ink { fill: #000; } .muted { fill: #808080; }
    .eyebrow { font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: 1.5px; text-transform: uppercase; }
    .title { font: 300 40px 'HB Set', 'Times New Roman', Georgia, serif; letter-spacing: -1.2px; }
    .subtitle, .axis-label, .tick, .key { font: 400 12px 'Pilat', Arial, Helvetica, sans-serif; }
    .point-label { font: 400 12px 'Pilat', Arial, Helvetica, sans-serif; }
    .axis { stroke: #000; stroke-width: 1; } .grid { stroke: #d9d9d9; stroke-width: 1; }
    .leader { stroke: #b2b2b2; stroke-width: 1; } .claude { stroke: #000; fill: #000; }
    .gpt { stroke: #4d4d4d; fill: #4d4d4d; } .docs { fill: none; stroke-width: 2.25; }
    .mcp { fill: none; stroke-width: 2.25; stroke-dasharray: 1 6; stroke-linecap: round; }
    .point { stroke: #f3f3f3; stroke-width: 2; }
  </style>
  <rect class="page" width="980" height="700"/>
  <text x="90" y="54" class="eyebrow muted">Tempo Bench · Production matrix</text>
  <text x="90" y="96" class="title ink">Tempo Bench score / turns</text>

  <line x1="90" y1="610" x2="900" y2="610" class="axis"/>
  <line x1="90" y1="160" x2="90" y2="610" class="axis"/>
  <g class="grid"><line x1="90" y1="610" x2="900" y2="610"/><line x1="90" y1="502.9" x2="900" y2="502.9"/><line x1="90" y1="395.7" x2="900" y2="395.7"/><line x1="90" y1="288.6" x2="900" y2="288.6"/><line x1="90" y1="181.4" x2="900" y2="181.4"/></g>
  <g class="tick muted"><text x="55" y="614">0.00</text><text x="55" y="506.9">0.25</text><text x="55" y="399.7">0.50</text><text x="55" y="292.6">0.75</text><text x="55" y="185.4">1.00</text><text x="86" y="632">500</text><text x="317.4" y="632">700</text><text x="548.9" y="632">900</text><text x="780.3" y="632">1100</text></g>
  <text x="495" y="670" text-anchor="middle" class="axis-label ink">Aggregate model turns</text>
  <text transform="translate(23 385) rotate(-90)" text-anchor="middle" class="axis-label ink">Tempo Bench score</text>
