version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /shared/tempo/verifier
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      verifier-npm-deps:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Buffer the scanner's seven-day minimum: Dependabot reads date-only tag metadata.
      default-days: 8
    groups:
      actions:
        patterns: ["*"]
