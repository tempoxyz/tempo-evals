name: Build task images

on:
  pull_request:
    paths:
      - .dockerignore
      - shared/global/docker/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/images.py
      - config/tasks.yaml
      - ci_checks/check-image-boundary.sh
      - .github/workflows/build-images.yml
  push:
    branches: [main]
    paths:
      - .dockerignore
      - shared/global/docker/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/images.py
      - config/tasks.yaml
      - ci_checks/check-image-boundary.sh
      - .github/workflows/build-images.yml

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image pair
        run: |
          set -euo pipefail
          docker build --tag tempo-bench-agent:ci \
            --file shared/global/docker/agent/Dockerfile .
          docker build --tag tempo-bench-verifier:ci \
            --build-arg AGENT_IMAGE=tempo-bench-agent:ci \
            --file shared/global/docker/verifier/Dockerfile .

      - name: Verify image boundary
        run: bash ci_checks/check-image-boundary.sh tempo-bench-agent:ci tempo-bench-verifier:ci

  build-and-push:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: build-task-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail
          image_exists() {
            local output
            if output=$(docker buildx imagetools inspect "$1" 2>&1); then
              return 0
            fi
            if [[ "$output" == *"$1: not found"* ]]; then
              return 1
            fi
            echo "$output" >&2
            exit 1
          }
          repository=$(uv run python scripts/images.py repository)
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          for image in agent verifier; do
            tag=$(uv run python scripts/images.py tag "$image")
            [[ "$tag" =~ ^${image}-source-[0-9a-f]{64}$ ]]
            ref="$repository:$tag"
            exists=false
            if image_exists "$ref"; then
              exists=true
            fi
            printf -v "${image}_exists" '%s' "$exists"
            {
              echo "${image}_ref=$ref"
              echo "${image}_exists=$exists"
            } >> "$GITHUB_OUTPUT"
          done
          if [ "$verifier_exists" = true ] && [ "$agent_exists" = false ]; then
            echo "Refusing a verifier image without its agent base." >&2
            exit 1
          fi

      - name: Build and push agent image
        if: steps.images.outputs.agent_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: shared/global/docker/agent/Dockerfile
          tags: ${{ steps.images.outputs.agent_ref }}
          push: true
          cache-from: type=gha,scope=tempo-bench-agent
          cache-to: type=gha,mode=max,scope=tempo-bench-agent

      - name: Resolve agent digest
        id: agent
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "${{ steps.images.outputs.agent_ref }}" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=${{ steps.images.outputs.repository }}@$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push verifier image
        if: steps.images.outputs.verifier_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: shared/global/docker/verifier/Dockerfile
          build-args: |
            AGENT_IMAGE=${{ steps.agent.outputs.ref }}
          tags: ${{ steps.images.outputs.verifier_ref }}
          push: true
          cache-from: type=gha,scope=tempo-bench-verifier
          cache-to: type=gha,mode=max,scope=tempo-bench-verifier

      - name: Resolve verifier digest
        id: verifier
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "${{ steps.images.outputs.verifier_ref }}" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=${{ steps.images.outputs.repository }}@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous pulls
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "${{ steps.agent.outputs.ref }}" >/dev/null
          docker buildx imagetools inspect "${{ steps.verifier.outputs.ref }}" >/dev/null

      - name: Verify image boundary
        run: >-
          bash ci_checks/check-image-boundary.sh
          "${{ steps.agent.outputs.ref }}"
          "${{ steps.verifier.outputs.ref }}"

      - name: Publish image references
        run: |
          echo "Agent image: \`${{ steps.agent.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifier image: \`${{ steps.verifier.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
