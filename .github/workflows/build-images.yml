name: Build task images

on:
  pull_request:
    paths:
      - .dockerignore
      - shared/global/docker/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/images.py
      - config/tasks.yaml
      - ci_checks/check-image-boundary.sh
      - .github/workflows/build-images.yml
  push:
    branches: [main]
    paths:
      - .dockerignore
      - shared/global/docker/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/images.py
      - config/tasks.yaml
      - ci_checks/check-image-boundary.sh
      - .github/workflows/build-images.yml

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image pair
        run: |
          set -euo pipefail
          docker build --tag stable-bench-agent:ci \
            --file shared/global/docker/agent/Dockerfile .
          docker build --tag stable-bench-verifier:ci \
            --build-arg AGENT_IMAGE=stable-bench-agent:ci \
            --file shared/global/docker/verifier/Dockerfile .

      - name: Verify image boundary
        run: bash ci_checks/check-image-boundary.sh stable-bench-agent:ci stable-bench-verifier:ci

  build-and-push:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: build-task-images
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@05c669ce878b8719779a28fe7375ba85822403f8

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

      - uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

      - uses: tempoxyz/gh-actions/vendor/docker/login-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail
          image_exists() {
            local output
            if output=$(docker buildx imagetools inspect "$1" 2>&1); then
              return 0
            fi
            if [[ "$output" == *"$1: not found"* ]]; then
              return 1
            fi
            echo "$output" >&2
            exit 1
          }
          repository=$(uv run python scripts/images.py repository)
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          for image in agent verifier; do
            tag=$(uv run python scripts/images.py tag "$image")
            [[ "$tag" =~ ^${image}-source-[0-9a-f]{64}$ ]]
            ref="$repository:$tag"
            exists=false
            if image_exists "$ref"; then
              exists=true
            fi
            printf -v "${image}_exists" '%s' "$exists"
            {
              echo "${image}_ref=$ref"
              echo "${image}_exists=$exists"
            } >> "$GITHUB_OUTPUT"
          done
          if [ "$verifier_exists" = true ] && [ "$agent_exists" = false ]; then
            echo "Refusing a verifier image without its agent base." >&2
            exit 1
          fi

      - name: Build and push agent image
        if: steps.images.outputs.agent_exists != 'true'
        uses: tempoxyz/gh-actions/vendor/docker/build-push-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          context: .
          file: shared/global/docker/agent/Dockerfile
          tags: ${{ steps.images.outputs.agent_ref }}
          push: true
          cache-from: type=gha,scope=stable-bench-agent
          cache-to: type=gha,mode=max,scope=stable-bench-agent

      - name: Resolve agent digest
        id: agent
        env:
          IMAGE_REF: ${{ steps.images.outputs.agent_ref }}
          REPOSITORY: ${{ steps.images.outputs.repository }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "$IMAGE_REF" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push verifier image
        if: steps.images.outputs.verifier_exists != 'true'
        uses: tempoxyz/gh-actions/vendor/docker/build-push-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          context: .
          file: shared/global/docker/verifier/Dockerfile
          build-args: |
            AGENT_IMAGE=${{ steps.agent.outputs.ref }}
          tags: ${{ steps.images.outputs.verifier_ref }}
          push: true
          cache-from: type=gha,scope=stable-bench-verifier
          cache-to: type=gha,mode=max,scope=stable-bench-verifier

      - name: Resolve verifier digest
        id: verifier
        env:
          IMAGE_REF: ${{ steps.images.outputs.verifier_ref }}
          REPOSITORY: ${{ steps.images.outputs.repository }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "$IMAGE_REF" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous pulls
        env:
          AGENT_REF: ${{ steps.agent.outputs.ref }}
          VERIFIER_REF: ${{ steps.verifier.outputs.ref }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "$AGENT_REF" >/dev/null
          docker buildx imagetools inspect "$VERIFIER_REF" >/dev/null

      - name: Verify image boundary
        env:
          AGENT_REF: ${{ steps.agent.outputs.ref }}
          VERIFIER_REF: ${{ steps.verifier.outputs.ref }}
        run: bash ci_checks/check-image-boundary.sh "$AGENT_REF" "$VERIFIER_REF"

      - name: Publish image references
        env:
          AGENT_REF: ${{ steps.agent.outputs.ref }}
          VERIFIER_REF: ${{ steps.verifier.outputs.ref }}
        run: |
          echo "Agent image: \`$AGENT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifier image: \`$VERIFIER_REF\`" >> "$GITHUB_STEP_SUMMARY"
