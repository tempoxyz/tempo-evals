name: Build task images

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - shared/global/docker/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/images.py
      - config/tasks.yaml
      - .github/workflows/build-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: build-task-images
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AGENT_REPOSITORY: ghcr.io/tempoxyz/tempo-bench-agent
      VERIFIER_REPOSITORY: ghcr.io/tempoxyz/tempo-bench-verifier
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Resolve image refs
        id: images
        run: |
          set -euo pipefail
          source_tag=$(uv run python scripts/images.py tag)
          [[ "$source_tag" =~ ^source-[0-9a-f]{16}$ ]]
          for image in agent verifier; do
            if [ "$image" = agent ]; then
              repository="$AGENT_REPOSITORY"
            else
              repository="$VERIFIER_REPOSITORY"
            fi
            release_ref="$repository:v1"
            [ "$(uv run python scripts/images.py repository "$image")" = "$repository" ]
            [ "$(uv run python scripts/images.py release "$image")" = "$release_ref" ]
            {
              echo "${image}_repository=$repository"
              echo "${image}_ref=$repository:$source_tag"
              echo "${image}_release_ref=$release_ref"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push agent image
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shared/global/docker/agent/Dockerfile
          tags: ${{ steps.images.outputs.agent_ref }}
          push: true
          cache-from: type=gha,scope=tempo-bench-agent
          cache-to: type=gha,mode=max,scope=tempo-bench-agent

      - name: Build and push verifier image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shared/global/docker/verifier/Dockerfile
          build-args: |
            AGENT_IMAGE=${{ steps.images.outputs.agent_repository }}@${{ steps.agent.outputs.digest }}
          tags: ${{ steps.images.outputs.verifier_ref }}
          push: true
          cache-from: type=gha,scope=tempo-bench-verifier
          cache-to: type=gha,mode=max,scope=tempo-bench-verifier

      - name: Update release images
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ steps.images.outputs.agent_release_ref }}" \
            "${{ steps.images.outputs.agent_ref }}"
          docker buildx imagetools create \
            --tag "${{ steps.images.outputs.verifier_release_ref }}" \
            "${{ steps.images.outputs.verifier_ref }}"

      - name: Publish image references
        run: |
          echo "Agent image: \`${{ steps.images.outputs.agent_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifier image: \`${{ steps.images.outputs.verifier_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
