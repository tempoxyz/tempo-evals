name: Build task images

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - shared/global/docker/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/images.py
      - config/tasks.yaml
      - ci_checks/check-image-boundary.sh
      - .github/workflows/build-images.yml

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - name: Detect image input changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The files API is capped at 3,000 files. Build conservatively at that limit.
          count=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')
          if [ "$count" -ge 3000 ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --slurp | jq '
            [ .[][] | .filename, .previous_filename // empty ] |
            any(test("^(\\.dockerignore$|shared/global/(docker|rewardkit-lib)/|shared/tempo/verifier/|scripts/images\\.py$|config/tasks\\.yaml$|ci_checks/check-image-boundary\\.sh$|\\.github/workflows/build-images\\.yml$)"))
          ')
          echo "images=$changed" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: >-
      needs.changes.outputs.images == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image pair
        run: |
          set -euo pipefail
          docker build --tag stable-bench-agent:ci \
            --file shared/global/docker/agent/Dockerfile .
          docker build --tag stable-bench-verifier:ci \
            --build-arg AGENT_IMAGE=stable-bench-agent:ci \
            --file shared/global/docker/verifier/Dockerfile .

      - name: Verify image boundary
        run: bash ci_checks/check-image-boundary.sh stable-bench-agent:ci stable-bench-verifier:ci

  publish:
    needs: changes
    if: >-
      needs.changes.outputs.images == 'true' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: build-task-images
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - uses: tempoxyz/gh-actions/vendor/docker/login-action@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: images
        run: |
          set -euo pipefail
          image_exists() {
            local output
            if output=$(docker buildx imagetools inspect "$1" 2>&1); then
              return 0
            fi
            if [[ "$output" == *"$1: not found"* ]]; then
              return 1
            fi
            echo "$output" >&2
            exit 1
          }
          repository=$(uv run python scripts/images.py repository)
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          for image in agent verifier; do
            tag=$(uv run python scripts/images.py tag "$image")
            [[ "$tag" =~ ^${image}-source-[0-9a-f]{64}$ ]]
            ref="$repository:$tag"
            exists=false
            if image_exists "$ref"; then
              exists=true
            fi
            printf -v "${image}_exists" '%s' "$exists"
            {
              echo "${image}_ref=$ref"
              echo "${image}_exists=$exists"
            } >> "$GITHUB_OUTPUT"
          done
          if [ "$verifier_exists" = true ] && [ "$agent_exists" = false ]; then
            echo "Refusing a verifier image without its agent base." >&2
            exit 1
          fi

      - name: Build and push agent image
        if: steps.images.outputs.agent_exists != 'true'
        uses: tempoxyz/gh-actions/vendor/docker/build-push-action@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          context: .
          file: shared/global/docker/agent/Dockerfile
          tags: ${{ steps.images.outputs.agent_ref }}
          push: true
          cache-from: type=gha,scope=stable-bench-agent
          cache-to: type=gha,mode=max,scope=stable-bench-agent

      - name: Resolve agent digest
        id: agent
        env:
          IMAGE_REF: ${{ steps.images.outputs.agent_ref }}
          REPOSITORY: ${{ steps.images.outputs.repository }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "$IMAGE_REF" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push verifier image
        if: steps.images.outputs.verifier_exists != 'true'
        uses: tempoxyz/gh-actions/vendor/docker/build-push-action@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          context: .
          file: shared/global/docker/verifier/Dockerfile
          build-args: |
            AGENT_IMAGE=${{ steps.agent.outputs.ref }}
          tags: ${{ steps.images.outputs.verifier_ref }}
          push: true
          cache-from: type=gha,scope=stable-bench-verifier
          cache-to: type=gha,mode=max,scope=stable-bench-verifier

      - name: Resolve verifier digest
        id: verifier
        env:
          IMAGE_REF: ${{ steps.images.outputs.verifier_ref }}
          REPOSITORY: ${{ steps.images.outputs.repository }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect \
            "$IMAGE_REF" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous pulls
        env:
          AGENT_REF: ${{ steps.agent.outputs.ref }}
          VERIFIER_REF: ${{ steps.verifier.outputs.ref }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "$AGENT_REF" >/dev/null
          docker buildx imagetools inspect "$VERIFIER_REF" >/dev/null

      - name: Verify image boundary
        env:
          AGENT_REF: ${{ steps.agent.outputs.ref }}
          VERIFIER_REF: ${{ steps.verifier.outputs.ref }}
        run: bash ci_checks/check-image-boundary.sh "$AGENT_REF" "$VERIFIER_REF"

      - name: Publish image references
        env:
          AGENT_REF: ${{ steps.agent.outputs.ref }}
          VERIFIER_REF: ${{ steps.verifier.outputs.ref }}
        run: |
          echo "Agent image: \`$AGENT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verifier image: \`$VERIFIER_REF\`" >> "$GITHUB_STEP_SUMMARY"

  # Keep the required check present, including for unrelated changes and forks.
  build-and-push:
    needs: [changes, validate, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check image job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGES_CHANGED: ${{ needs.changes.outputs.images }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if [ "$IMAGES_CHANGED" = false ]; then
            echo "No image inputs changed."
          elif [ "$IMAGES_CHANGED" = true ]; then
            if [ "$IS_FORK" = true ]; then
              test "$VALIDATE_RESULT" = success
            else
              test "$PUBLISH_RESULT" = success
            fi
          else
            echo "Image change detection did not return a valid result."
            exit 1
          fi
