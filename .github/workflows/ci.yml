name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Lint and dataset freshness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore pinned docs bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tempo-docs
          key: tempo-docs-${{ hashFiles('config/tempo-docs.lock.json') }}

      - name: Install Python dependencies
        run: uv sync --locked --dev --all-extras

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run lint checks
        run: npm run check

      - name: Verify dataset freshness
        run: npm run check:dataset

      - name: Verify MPP dataset freshness
        run: npm run check:dataset -- --tasks tasks/mpp

      - name: Verify Tempo MCP dataset freshness
        run: npm run check:dataset -- --tasks tasks/tempo-mcp-v1
