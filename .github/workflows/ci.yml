name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  checks:
    name: Lint and dataset freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore pinned docs bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tempo-docs
          key: tempo-docs-${{ hashFiles('config/tempo-docs.lock.json') }}

      - name: Install Python dependencies
        run: uv sync --locked --dev --all-extras

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run lint checks
        run: npm run check

      - name: Verify dataset freshness
        run: npm run check:dataset

      - name: Verify MPP dataset freshness
        run: npm run check:dataset -- --tasks tasks/mpp

      - name: Verify Tempo MCP dataset freshness
        run: npm run check:dataset -- --tasks tasks/tempo-mcp-v1
