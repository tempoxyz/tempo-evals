name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Lint and dataset freshness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore pinned docs bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tempo-docs
          key: tempo-docs-${{ hashFiles('config/tempo-docs.lock.json') }}

      - name: Install Python dependencies
        run: uv sync --locked --dev --all-extras

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run lint checks
        run: npm run check

      - name: Verify dataset freshness
        run: npm run check:dataset

      - name: Verify MPP dataset freshness
        run: npm run check:dataset -- --tasks tasks/mpp

      - name: Verify Tempo MCP dataset freshness
        run: npm run check:dataset -- --tasks tasks/tempo-mcp-v1
