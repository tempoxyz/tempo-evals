name: Build base image

on:
  push:
    branches: [main]
    paths:
      - shared/global/docker/base/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/base_image.py
      - config/tasks.yaml
      - .github/workflows/build-base-image.yml
  pull_request:
    paths:
      - shared/global/docker/base/**
      - shared/global/rewardkit-lib/**
      - shared/tempo/verifier/**
      - scripts/base_image.py
      - config/tasks.yaml
      - .github/workflows/build-base-image.yml
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for a short-lived image
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Resolve image refs
        id: image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          repository=$(uv run python scripts/base_image.py ref | sed 's/:source-.*$//')
          source_tag=$(uv run python scripts/base_image.py tag)
          if [ -n "$PR_NUMBER" ]; then
            tag="pr-$PR_NUMBER-$source_tag"
          else
            tag="main-$source_tag"
          fi
          echo "ref=$repository:$tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=$(sed -nE 's/^[[:space:]]*base_image:[[:space:]]*([^[:space:]#]+).*/\1/p' config/tasks.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: shared/global/docker/base/Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          push: true
          cache-from: type=gha,scope=tempo-bench-base
          cache-to: type=gha,mode=max,scope=tempo-bench-base

      - name: Update release image
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.release_ref }}" \
            "${{ steps.image.outputs.ref }}"

      - name: Publish image reference
        run: |
          echo "Base image: \`${{ steps.image.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
