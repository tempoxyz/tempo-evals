name: Compile checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-compile:
    name: Check compiler output
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check Ruff formatting
        run: uv run ruff format --check obrist datasets tests

      - name: Run Ruff lint
        run: uv run ruff check obrist datasets tests

      - name: Add uv tool directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Harbor
        run: uv tool install harbor

      - name: Run checks
        run: make check
