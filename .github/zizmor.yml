rules:
  dangerous-triggers:
    ignore:
      # This workflow checks out executable checks from the trusted base revision
      # and only sparse-checks untrusted task data into a separate directory.
      - static-checks.yml
  ref-version-mismatch:
    # tempoxyz/gh-actions uses dated tag comments for its SHA pins.
    # Third-party pins retain their version comments for reviewability.
    disable: true
