# The runner configures the main service. This file forwards Tempo task
# environment values and keeps the pinned docs sidecar.
services:
  main:
    environment:
      - TEMPO_AMOUNT
      - TEMPO_BENCH_CASE
      - TEMPO_BENCH_LOG_WAIT_MS
      - TEMPO_BENCH_RPC_WAIT_MS
      - TEMPO_BENCH_SUBMISSION_TIMEOUT_MS
      - TEMPO_BENCH_TOKENS_SCORE_CUTOFFS
      - TEMPO_BENCH_TURNS_SCORE_CUTOFFS
      - TEMPO_DECIMALS
      - TEMPO_DEX_MAKER_PRIVATE_KEY
      - TEMPO_DOCS_URL
      - TEMPO_FAUCET_PRIVATE_KEY
      - TEMPO_FEE_MANAGER
      - TEMPO_FEE_PAYER_PRIVATE_KEY
      - TEMPO_FEE_TOKEN
      - TEMPO_MEMO
      - TEMPO_PAYER_PRIVATE_KEY
      - TEMPO_POLICY_ACCOUNT
      - TEMPO_POLICY_TYPE
      - TEMPO_RECIPIENT
      - TEMPO_STABLECOIN_CURRENCY
      - TEMPO_STABLECOIN_DEX
      - TEMPO_STABLECOIN_NAME
      - TEMPO_STABLECOIN_SALT
      - TEMPO_STABLECOIN_SYMBOL
      - TEMPO_SWAP_AMOUNT_IN
      - TEMPO_SWAP_MIN_AMOUNT_OUT
      - TEMPO_SWAP_TOKEN_IN
      - TEMPO_SWAP_TOKEN_OUT
      - TEMPO_TIP20_FACTORY
      - TEMPO_TIP403_REGISTRY
      - TEMPO_TOKEN
    depends_on:
      tempo-docs:
        condition: service_healthy

  tempo-docs:
    build:
      context: ./tempo-docs
    volumes:
      - ${TEMPO_DOCS_BUNDLE_PATH:-./tempo-docs-bundle}:/tempo-docs:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
