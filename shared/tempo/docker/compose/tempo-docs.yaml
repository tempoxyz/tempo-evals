# The runner configures the main service. This file forwards Tempo task
# environment values and keeps the pinned docs sidecar.
services:
  main:
    # Docker Compose only forwards task env vars that are listed here. This is
    # the union needed by Tempo tasks; individual tasks use
    # subsets of these values.
    environment:
      - TEMPO_AMOUNT
      - STABLE_BENCH_CASE
      - STABLE_BENCH_LOG_WAIT_MS
      - STABLE_BENCH_RPC_WAIT_MS
      - STABLE_BENCH_SUBMISSION_TIMEOUT_MS
      - STABLE_BENCH_TOKENS_SCORE_CUTOFFS
      - STABLE_BENCH_TURNS_SCORE_CUTOFFS
      - TEMPO_DECIMALS
      - TEMPO_FEE_MANAGER
      - TEMPO_FEE_TOKEN
      - TEMPO_MEMO
      - TEMPO_POLICY_ACCOUNT
      - TEMPO_POLICY_TYPE
      - TEMPO_RECIPIENT
      - TEMPO_RECIPIENTS
      - TEMPO_STABLECOIN_CURRENCY
      - TEMPO_STABLECOIN_DEX
      - TEMPO_SWAP_AMOUNT_IN
      - TEMPO_SWAP_MIN_AMOUNT_OUT
      - TEMPO_SWAP_TOKEN_IN
      - TEMPO_SWAP_TOKEN_OUT
      - TEMPO_TIP20_FACTORY
      - TEMPO_TIP403_REGISTRY
      - TEMPO_TOKEN
    depends_on:
      tempo-docs:
        condition: service_healthy

  tempo-docs:
    build:
      context: ./docs-proxy
    environment:
      DOCS_SITE_NAME: Tempo docs
      DOCS_ROOT: /docs
      DOCS_INDEX_PATH: /developers/index.html
      DOCS_HEALTH_PATH: /developers/llms.txt
      DOCS_BASE_URL: https://docs.tempo.xyz
      ACCESS_LOG_PATH: /var/log/tempo-docs/access.log
      DOCS_EXACT_ALIASES: '{"/":"/developers","/llms.txt":"/developers/llms.txt","/llms-full.txt":"/developers/llms-full.txt","/docs":"/developers/docs.md","/docs/":"/developers/docs.md","/developers/docs":"/developers/docs.md","/developers/docs/":"/developers/docs.md"}'
      DOCS_PREFIX_ALIASES: '[["/docs/","/developers/docs/"]]'
      DOCS_STRIP_TRAILING_SLASH_PREFIXES: '["/developers/docs/","/docs/"]'
    volumes:
      - ${TEMPO_DOCS_BUNDLE_PATH:-./tempo-docs-bundle}:/docs:ro
      - ./docs-tls:/tls:ro
    networks:
      default:
        aliases:
          - docs.tempo.xyz
    expose:
      - "80"
      - "443"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
