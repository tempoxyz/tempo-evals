# Baked into the tempo-bench base image; see shared/global/docker/base/Dockerfile.
[project]
name = "tempo-bench-rewardkit"
version = "0.1.0"
description = "Shared RewardKit criteria and MPP verifier harness for Tempo benchmark tasks"
requires-python = ">=3.11"
dependencies = [
  "harbor-rewardkit==0.1.7",
  "pympp[tempo]==0.9.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
tempo_bench_rewardkit = ["mpp/*.ts"]
