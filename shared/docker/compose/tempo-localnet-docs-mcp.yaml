# The runner configures the `main` service. This file adds the Tempo localnet
# and docs MCP sidecars and makes the agent container wait for both.
services:
  main:
    environment:
      - TEMPO_AMOUNT
      - TEMPO_ACCESS_KEY_LIMIT
      - TEMPO_ACCESS_KEY_PERIOD_SECONDS
      - TEMPO_ACCESS_KEY_PRIVATE_KEY
      - TEMPO_ACCOUNT_KEYCHAIN
      - TEMPO_BENCH_CASE
      - TEMPO_BENCH_LOG_WAIT_MS
      - TEMPO_BENCH_RPC_WAIT_MS
      - TEMPO_BENCH_SUBMISSION_TIMEOUT_MS
      - TEMPO_DECIMALS
      - TEMPO_DEX_MAKER_PRIVATE_KEY
      - TEMPO_FAUCET_PRIVATE_KEY
      - TEMPO_FEE_MANAGER
      - TEMPO_FEE_PAYER_PRIVATE_KEY
      - TEMPO_FEE_TOKEN
      - TEMPO_MEMO
      - TEMPO_MULTI_AMOUNTS
      - TEMPO_MULTI_RECIPIENTS
      - TEMPO_PAYER_PRIVATE_KEY
      - TEMPO_POLICY_ACCOUNT
      - TEMPO_POLICY_TYPE
      - TEMPO_RECIPIENT
      - TEMPO_RECIPIENT_PRIVATE_KEY
      - TEMPO_RECEIVE_POLICY_GUARD
      - TEMPO_RECEIVE_POLICY_SENDER_POLICY_ID
      - TEMPO_RECEIVE_POLICY_TOKEN_POLICY_ID
      - TEMPO_RPC_URL
      - TEMPO_STABLECOIN_CURRENCY
      - TEMPO_STABLECOIN_DEX
      - TEMPO_STABLECOIN_NAME
      - TEMPO_STABLECOIN_SALT
      - TEMPO_STABLECOIN_SYMBOL
      - TEMPO_SWAP_AMOUNT_IN
      - TEMPO_SWAP_MIN_AMOUNT_OUT
      - TEMPO_SWAP_TOKEN_IN
      - TEMPO_SWAP_TOKEN_OUT
      - TEMPO_TIP20_FACTORY
      - TEMPO_TIP403_REGISTRY
      - TEMPO_TOKEN
    depends_on:
      tempo-localnet:
        condition: service_healthy
      tempo-docs-mcp:
        condition: service_healthy

  tempo-localnet:
    build:
      context: ./tempo-localnet
    expose:
      - "8545"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://localhost:8545",
          "-H",
          "content-type: application/json",
          "-d",
          "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  tempo-docs-mcp:
    build:
      context: ./tempo-docs-mcp
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
