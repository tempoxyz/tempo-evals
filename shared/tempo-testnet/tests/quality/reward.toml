# SYNCED FROM shared/tempo-testnet/tests/quality/reward.toml BY npm run sync. DO NOT EDIT COPIES IN tasks/.
[judge]
judge = "anthropic/claude-haiku-4-5"
mode = "batched"
files = ["package.json", "tsconfig.json", "src/index.ts"]
atif-trajectory = "/logs/trajectory.json"
timeout = 300

[[criterion]]
name = "uses_tempo_testnet_safely"
description = "The implementation uses provided Tempo testnet environment variables, avoids hard-coded private secrets or fixture values, and submits only the requested transfer with memo transaction."

[[criterion]]
name = "implements_transaction_artifact_boundary"
description = "The submission writes the requested /app/out.json transactionHash contract so the verifier can load and check the transaction."

[[criterion]]
name = "is_minimal_and_maintainable"
description = "The solution is focused, readable TypeScript with simple dependencies and no unrelated scaffolding or dead code."

[[criterion]]
description = "Did the agent take an efficient approach?"
type = "likert"
points = 5

[scoring]
aggregation = "weighted_mean"
