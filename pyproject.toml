[project]
name = "tempo-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harbor-rewardkit==0.1.7",
    "harbor[daytona]>=0.18.0,<0.19",
    "jinja2>=3.1.6,<4",
    "pandas>=3.0.3,<4",
    "pyyaml>=6.0.3,<7",
    "tomlkit>=0.15.0,<0.16",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "shellcheck-py>=0.11.0.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tasks/*/tests/correctness/criteria.py" = ["F401"]
"sources/*/tests/correctness/criteria.py" = ["F401"]
