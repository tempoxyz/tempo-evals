[project]
name = "tempo-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harbor-rewardkit==0.2.0",
    "harbor[daytona]>=0.22.0,<0.23",
    "jinja2>=3.1.6,<4",
    "pandas>=3.0.5,<4",
    "pyyaml>=6.0.3,<7",
    "tomlkit>=0.15.1,<0.16",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0,<8",
    "ruff>=0.16.5",
    "shellcheck-py>=0.11.0.1",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["evalkit"]

[tool.coverage.report]
fail_under = 99
omit = ["*/*_test.py"]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tasks/*/tests/correctness/criteria.py" = ["F401"]
"sources/*/tests/correctness/criteria.py" = ["F401"]
