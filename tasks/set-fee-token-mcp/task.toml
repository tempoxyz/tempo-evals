schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/set-fee-token-mcp"
description = "Build a Tempo localnet integration that sets AlphaUSD as the account's default fee token. (MCP profile)."
authors = []
keywords = ["tempo", "fee-token", "alpha-usd", "localnet", "typescript", "mcp"]

[metadata]
category = "integration"
feature = "set-fee-token"
profile = "mcp"
[metadata.tempo_bench.correctness]
shared = ["typescript_project", "source_patterns", "build_run_onchain"]

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_calls_set_user_token"
pattern = "setUserToken"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_reads_tempo_fee_token"
pattern = "TEMPO_FEE_TOKEN"

[metadata.tempo_bench.quality]
shared = ["agent_turn_efficiency", "agent_token_efficiency", "llm_judge"]

[verifier]
timeout_sec = 300.0
environment_mode = "shared"


[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
[[environment.mcp_servers]]
name = "tempo"
transport = "streamable-http"
url = "https://mcp.tempo.xyz"

[environment.env]
TEMPO_BENCH_CASE = "set-fee-token"
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_RPC_URL = "http://tempo-localnet:8545"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_FEE_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_FEE_MANAGER = "0xfeec000000000000000000000000000000000000"
TEMPO_PAYER_PRIVATE_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_AMOUNT = "0.01"
TEMPO_MEMO = "TEMPO-FEE-TOKEN"
TEMPO_DECIMALS = "6"
TEMPO_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
TEMPO_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
