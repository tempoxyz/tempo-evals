schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/transfer-with-memo-fee-payer-mcp"
description = "Build a Tempo localnet integration that sends a memo transfer sponsored by a fee payer. (MCP profile)."
authors = []
keywords = ["tempo", "tip20", "memo", "fee-payer", "localnet", "typescript", "mcp"]

[metadata]
category = "integration"
feature = "transfer-with-memo-fee-payer"
profile = "mcp"
[metadata.tempo_bench.correctness]
shared = ["typescript_project", "source_patterns", "build_run_onchain"]

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_uses_transfer_with_memo_semantics"
pattern = "transferWithMemo|transferSync"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_reads_tempo_memo"
pattern = "TEMPO_MEMO"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_parses_token_units"
pattern = "parseUnits"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_reads_fee_payer_private_key"
pattern = "TEMPO_FEE_PAYER_PRIVATE_KEY"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_passes_fee_payer"
pattern = "feePayer"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_reads_fee_token"
pattern = "TEMPO_FEE_TOKEN"

[metadata.tempo_bench.quality]
shared = ["agent_turn_efficiency", "agent_token_efficiency", "llm_judge"]

[verifier]
timeout_sec = 300.0
environment_mode = "shared"


[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
[[environment.mcp_servers]]
name = "tempo"
transport = "streamable-http"
url = "https://mcp.tempo.xyz"

[environment.env]
TEMPO_BENCH_CASE = "transfer-with-memo"
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_RPC_URL = "http://tempo-localnet:8545"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_FEE_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_PAYER_PRIVATE_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
TEMPO_FEE_PAYER_PRIVATE_KEY = "0x59c6995e998f97a5a004497e5da46f94a879b621718eb9bde6e3db6c2b2b3b4d"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_AMOUNT = "0.19"
TEMPO_MEMO = "TEMPO-FEEPAYER-001"
TEMPO_DECIMALS = "6"
TEMPO_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
TEMPO_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
