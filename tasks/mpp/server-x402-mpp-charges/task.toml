schema_version = "1.3"

artifacts = [{ source = "/app", exclude = ["node_modules"] }, "/logs/agent/trajectory.json"]

[task]
name = "tempo/mpp-server-x402-mpp-charges"
description = "Build a TypeScript server exposing MPP pathUSD and x402 USDC charge routes."
authors = []
keywords = ["mpp", "tempo", "pathusd", "typescript", "server"]

[metadata]
category = "integration"
feature = "server-x402-mpp-charges"
dataset = "mpp-bench-v1"
benchmark = "mpp-bench-v1"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
