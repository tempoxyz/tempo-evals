schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/mpp-client-access-keys"
description = "Build a TypeScript MPP client that pays a Tempo pathUSD endpoint using a provided access key."
authors = []
keywords = ["mpp", "tempo", "pathusd", "typescript", "client", "access-key"]

[metadata]
category = "integration"
feature = "client-access-keys"
dataset = "mpp-bench-v1"
benchmark = "mpp-bench-v1"

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
