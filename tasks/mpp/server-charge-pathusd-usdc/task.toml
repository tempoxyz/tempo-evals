schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/mpp-server-charge-pathusd-usdc"
description = "Build a TypeScript MPP server with one free endpoint and one paid endpoint that accepts pathUSD and advertises USDC."
authors = []
keywords = ["mpp", "tempo", "pathusd", "typescript", "server"]

[metadata]
category = "integration"
feature = "server-charge-pathusd-usdc"
dataset = "mpp-bench-v1"
benchmark = "mpp-bench-v1"

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
