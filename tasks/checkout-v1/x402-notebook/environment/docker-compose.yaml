services:
  main:
    depends_on:
      wallet:
        condition: service_completed_successfully
      merchant:
        condition: service_healthy
      browser:
        condition: service_healthy
      payment-setup:
        condition: service_completed_successfully
    volumes:
      - checkout-wallet:/wallet:ro
  wallet:
    build:
      context: ./wallet
    environment:
      TEMPO_RPC_URL: ${TEMPO_RPC_URL:-https://rpc.moderato.tempo.xyz}
      PAYPAL_SANDBOX_BUYER_EMAIL: ${PAYPAL_SANDBOX_BUYER_EMAIL:-}
      PAYPAL_SANDBOX_BUYER_PASSWORD: ${PAYPAL_SANDBOX_BUYER_PASSWORD:-}
    volumes:
      - checkout-wallet:/wallet
    restart: "no"

  payment-setup:
    build:
      context: ./payment
    depends_on:
      wallet:
        condition: service_completed_successfully
    environment:
      X402_FUNDING_PRIVATE_KEY: ${X402_FUNDING_PRIVATE_KEY:?Base Sepolia funding key is required}
      X402_RECIPIENT_ADDRESS: ${X402_RECIPIENT_ADDRESS:?Base Sepolia recipient is required}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
    volumes:
      - checkout-wallet:/wallet
    restart: "no"

  recovery:
    build:
      context: ./payment
    command: ["sh", "-c", "sleep infinity"]
    environment:
      X402_FUNDING_PRIVATE_KEY: ${X402_FUNDING_PRIVATE_KEY:?Base Sepolia funding key is required}
      X402_RECIPIENT_ADDRESS: ${X402_RECIPIENT_ADDRESS:?Base Sepolia recipient is required}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
    volumes:
      - checkout-wallet:/wallet:ro

  merchant:
    build:
      context: ./merchant
    environment:
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:?Stripe sandbox key is required}
      X402_RECIPIENT_ADDRESS: ${X402_RECIPIENT_ADDRESS:?Base Sepolia recipient is required}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  browser:
    image: mcr.microsoft.com/playwright/mcp@sha256:690763cbb437ee7233f538a953bb5390bf03791eb5c965b471e59d17a6132fcb
    entrypoint: node
    command: ["/app/cli.js", "--headless", "--browser", "chromium", "--no-sandbox", "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--isolated"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8931/mcp').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  checkout-wallet:
