services:
  main:
    depends_on:
      wallet:
        condition: service_completed_successfully
      merchant:
        condition: service_healthy
      browser:
        condition: service_healthy
      link:
        condition: service_completed_successfully
      browser-ready:
        condition: service_completed_successfully
    volumes:
      - checkout-wallet:/opt/agent/wallet:ro
      - checkout-browser-output:/tmp/.playwright-mcp:ro
  wallet:
    build:
      context: ./wallet
    environment:
      DECLINED_CARD_NUMBER: "4000000000000002"
      TEMPO_RPC_URL: ${TEMPO_RPC_URL:-https://rpc.moderato.tempo.xyz}
      PAYPAL_SANDBOX_BUYER_EMAIL: ${PAYPAL_SANDBOX_BUYER_EMAIL:?PayPal sandbox buyer email is required}
      PAYPAL_SANDBOX_BUYER_PASSWORD: ${PAYPAL_SANDBOX_BUYER_PASSWORD:?PayPal sandbox buyer password is required}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      SHOPIFY_STOREFRONT_PASSWORD: ${SHOPIFY_STOREFRONT_PASSWORD:?Shopify storefront password is required}
    volumes:
      - checkout-wallet:/wallet
    restart: "no"

  merchant:
    build:
      context: ./merchant
    environment:
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:?Stripe sandbox key is required}
      PUBLIC_BASE_URL: http://merchant:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  link:
    build:
      context: ./link
    depends_on:
      wallet:
        condition: service_completed_successfully
      merchant:
        condition: service_healthy
      browser:
        condition: service_healthy
    environment:
      CARD_DECLINE: "1"
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:?Stripe sandbox key is required}
    volumes:
      - checkout-wallet:/wallet
    restart: "no"

  # Pinned Playwright MCP extended by shared/checkout/browser (synced to ./browser).
  browser:
    build:
      context: ./browser
    entrypoint: /opt/checkout/node_modules/.bin/tsx
    command: ["/app/cli.js", "--headless", "--browser", "chromium", "--no-sandbox", "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--isolated", "--no-webmcp", "--output-dir", "/tmp/.playwright-mcp", "--file-paths", "absolute", "--config", "/opt/checkout/browser.json", "--init-page", "/opt/checkout/merchant-route.ts"]
    volumes:
      - checkout-browser-output:/tmp/.playwright-mcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8931/mcp').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Opens the merchant through the browser after Link enrollment, before main starts.
  browser-ready:
    build:
      context: ./browser
    entrypoint: /opt/checkout/node_modules/.bin/tsx
    command: ["/opt/checkout/ready.ts"]
    depends_on:
      link:
        condition: service_completed_successfully
    restart: "no"

volumes:
  checkout-wallet:
  checkout-browser-output:
