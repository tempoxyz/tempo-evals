schema_version = "1.3"

artifacts = [
  "/logs/agent/trajectory.json",
  { source = "/var/log/checkout/snapshot.json", service = "merchant" },
]

[task]
name = "checkout-v1/stripe-notebook"
description = "Buy a notebook from a test merchant using Stripe Checkout."
keywords = ["checkout", "stripe", "payments", "browser"]

[metadata]
category = "checkout"
benchmark = "checkout-bench-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[[verifier.collect]]
service = "merchant"
command = "tsx /srv/snapshot.ts"
timeout_sec = 90.0

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
STRIPE_TEST_SECRET_KEY = "${STRIPE_TEST_SECRET_KEY}"
CHECKOUT_LINK_TEST_EMAIL = "${CHECKOUT_LINK_TEST_EMAIL}"
TEMPO_RPC_URL = "${TEMPO_RPC_URL:-https://rpc.moderato.tempo.xyz}"

[[environment.mcp_servers]]
name = "browser"
transport = "streamable-http"
url = "http://browser:8931/mcp"
