[judge]
judge = "anthropic/claude-haiku-4-5"
mode = "individual"
files = ["package.json", "tsconfig.json", "src/index.ts"]
timeout = 300

[[criterion]]
name = "uses_privy_policies_appropriately"
type = "likert"
points = 5
description = "The submission reads Privy credentials and the allowed recipient from the environment without hard-coding them, creates a recipient-allowlist policy with ethereum_transaction conditions, and attaches the policy to the wallet."

[[criterion]]
name = "uses_sdk_primitives_correctly"
type = "likert"
points = 5
description = "The code uses the Privy Node SDK policy and wallet APIs correctly, signs the compliant transaction through the Privy wallet API, and reports the policy ID and signed transaction accurately."

[[criterion]]
name = "is_minimal_and_maintainable"
type = "likert"
points = 5
description = "The solution is a focused TypeScript implementation with simple dependencies, readable structure, and no unrelated scaffolding or dead code. Task-required files and fixed output contracts such as /app/out.json are expected and must not be treated as hard-coding or unnecessary scaffolding."

[scoring]
aggregation = "weighted_mean"
