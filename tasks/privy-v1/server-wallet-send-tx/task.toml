schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "privy-v1/server-wallet-send-tx"
description = "Send a Tempo testnet stablecoin transfer from a Privy Ethereum server wallet."
authors = []
keywords = ["privy", "server-wallets", "tempo", "tip20", "typescript"]

[metadata]
category = "integration"
feature = "server-wallet-send-tx"
benchmark = "privy-bench-v1"
[verifier]
timeout_sec = 300.0
environment_mode = "shared"


[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_BENCH_CASE = "privy-wallet-send-tx"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_DECIMALS = "6"
TEMPO_AMOUNT = "0.21"
TEMPO_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
TEMPO_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
