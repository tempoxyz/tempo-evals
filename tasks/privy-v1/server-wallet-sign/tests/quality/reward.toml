[judge]
judge = "anthropic/claude-haiku-4-5"
mode = "individual"
files = ["package.json", "tsconfig.json", "src/index.ts"]
timeout = 300

[[criterion]]
name = "uses_privy_credentials_appropriately"
type = "likert"
points = 5
description = "The submission reads the Privy credentials and the message to sign from the environment without hard-coding credentials, wallet IDs, messages, or signatures."

[[criterion]]
name = "uses_privy_sdk_correctly"
type = "likert"
points = 5
description = "The code uses the Privy Node SDK to create a server wallet and produce an EIP-191 personal signature over the provided message, reporting values returned by the API."

[[criterion]]
name = "is_minimal_and_maintainable"
type = "likert"
points = 5
description = "The solution is a focused TypeScript implementation with simple dependencies, readable structure, and no unrelated scaffolding or dead code. Task-required files and fixed output contracts such as /app/out.json are expected and must not be treated as hard-coding or unnecessary scaffolding."

[scoring]
aggregation = "weighted_mean"
