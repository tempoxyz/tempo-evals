schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/multiparty-batch-transfer-docs"
description = "Build a Tempo localnet integration that pays multiple parties in a single Tempo transaction. (docs profile)."
authors = []
keywords = ["tempo", "batch", "multiparty", "tip20", "localnet", "typescript", "docs"]

[metadata]
category = "integration"
feature = "multiparty-batch-transfer"
profile = "docs"
[verifier]
timeout_sec = 300.0
environment_mode = "shared"


[agent]
timeout_sec = 900.0

[environment]
