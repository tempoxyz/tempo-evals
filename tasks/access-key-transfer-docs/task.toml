schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/access-key-transfer-docs"
description = "Build a Tempo localnet integration that authorizes an access key and uses it to send a memo transfer. (docs profile)."
authors = []
keywords = ["tempo", "access-key", "tip20", "memo", "localnet", "typescript", "docs"]

[metadata]
category = "integration"
feature = "access-key-transfer"
profile = "docs"
[verifier]
timeout_sec = 300.0
environment_mode = "shared"


[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
TEMPO_BENCH_CASE = "access-key-transfer"
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_RPC_URL = "http://tempo-localnet:8545"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_PAYER_PRIVATE_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
TEMPO_ACCESS_KEY_PRIVATE_KEY = "0x5de4111afa1a4b4b3f3fcb79f2db8d3655b896b95fc981bc56b6d59d12085018"
TEMPO_ACCOUNT_KEYCHAIN = "0xaAAAaaAA00000000000000000000000000000000"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_AMOUNT = "0.21"
TEMPO_ACCESS_KEY_LIMIT = "1.00"
TEMPO_MEMO = "TEMPO-ACCESSKEY-001"
TEMPO_DECIMALS = "6"
TEMPO_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
TEMPO_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
TEMPO_DOCS_URL = "https://docs.tempo.xyz/"
