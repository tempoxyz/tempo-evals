schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/stablecoin-dex-swap-mcp"
description = "Build a Tempo localnet integration that approves the Stablecoin DEX, creates liquidity, and executes a swap. (MCP profile)."
authors = []
keywords = ["tempo", "stablecoin-dex", "swap", "tip20", "localnet", "typescript", "mcp"]

[metadata]
category = "integration"
feature = "stablecoin-dex-swap"
profile = "mcp"
[metadata.tempo_bench.correctness]
shared = ["typescript_project", "source_patterns", "build_run_onchain"]

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_uses_dex_actions"
pattern = "Actions\\.dex|\\.dex\\."

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_approves_dex_spending"
pattern = "approveSync"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_provides_dex_liquidity"
pattern = "placeSync|provideLiquidity|addLiquidity"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_executes_dex_swap"
pattern = "sellSync|buySync|swapSync"

[[metadata.tempo_bench.correctness.source_patterns]]
name = "source_reads_swap_token_env"
pattern = "TEMPO_SWAP_TOKEN_IN[\\s\\S]*TEMPO_SWAP_TOKEN_OUT|TEMPO_SWAP_TOKEN_OUT[\\s\\S]*TEMPO_SWAP_TOKEN_IN"

[metadata.tempo_bench.quality]
shared = ["agent_turn_efficiency", "agent_token_efficiency", "llm_judge"]

[verifier]
timeout_sec = 300.0
environment_mode = "shared"


[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
[[environment.mcp_servers]]
name = "tempo"
transport = "streamable-http"
url = "https://mcp.tempo.xyz"

[environment.env]
TEMPO_BENCH_CASE = "stablecoin-dex-swap"
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_RPC_URL = "http://tempo-localnet:8545"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_STABLECOIN_DEX = "0xdec0000000000000000000000000000000000000"
TEMPO_PAYER_PRIVATE_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
TEMPO_DEX_MAKER_PRIVATE_KEY = "0x59c6995e998f97a5a004497e5da46f94a879b621718eb9bde6e3db6c2b2b3b4d"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_AMOUNT = "100"
TEMPO_MEMO = "TEMPO-DEX"
TEMPO_DECIMALS = "6"
TEMPO_SWAP_TOKEN_IN = "0x20c0000000000000000000000000000000000000"
TEMPO_SWAP_TOKEN_OUT = "0x20c0000000000000000000000000000000000001"
TEMPO_SWAP_AMOUNT_IN = "100"
TEMPO_SWAP_MIN_AMOUNT_OUT = "0"
TEMPO_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
TEMPO_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
