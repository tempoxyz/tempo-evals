schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo/transfer-with-memo"
description = "Build a minimal Tempo localnet integration that sends a TIP-20 transfer with a memo."
authors = []
keywords = ["tempo", "tip20", "memo", "localnet", "typescript"]

[metadata]
category = "integration"
feature = "transfer-with-memo"

[verifier]
timeout_sec = 300.0

[verifier.env]
TEMPO_BENCH_CASE = "transfer-with-memo"
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_RPC_URL = "http://tempo-localnet:8545"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_PAYER_PRIVATE_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_AMOUNT = "0.17"
TEMPO_MEMO = "TEMPO-EVAL-001"
TEMPO_DECIMALS = "6"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

# Tempo Bench knobs exposed to the agent/submission container. Keep these in
# sync with [verifier.env], which Harbor passes to the verifier process.
[environment.env]
TEMPO_BENCH_CASE = "transfer-with-memo"
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_RPC_URL = "http://tempo-localnet:8545"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_PAYER_PRIVATE_KEY = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_AMOUNT = "0.17"
TEMPO_MEMO = "TEMPO-EVAL-001"
TEMPO_DECIMALS = "6"
