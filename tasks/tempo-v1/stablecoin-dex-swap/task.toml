schema_version = "1.3"

artifacts = ["/app/package.json", "/app/tsconfig.json", "/app/src", "/logs/agent/trajectory.json"]

[task]
name = "tempo-v1/stablecoin-dex-swap"
description = "Build a Tempo testnet integration that executes a Stablecoin DEX swap."
authors = []
keywords = ["tempo", "stablecoin-dex", "swap", "tip20", "testnet", "typescript"]

[metadata]
category = "integration"
feature = "stablecoin-dex-swap"
benchmark = "tempo-bench-v1"
[verifier]
timeout_sec = 300.0
environment_mode = "separate"


[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_DECIMALS = "6"
TEMPO_BENCH_CASE = "stablecoin-dex-swap"
TEMPO_AMOUNT = "100"
TEMPO_MEMO = "TEMPO-DEX"
TEMPO_STABLECOIN_DEX = "0xdec0000000000000000000000000000000000000"
TEMPO_SWAP_TOKEN_IN = "0x20c0000000000000000000000000000000000000"
TEMPO_SWAP_TOKEN_OUT = "0x20c0000000000000000000000000000000000001"
TEMPO_SWAP_AMOUNT_IN = "100"
TEMPO_SWAP_MIN_AMOUNT_OUT = "0"
TEMPO_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
TEMPO_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
