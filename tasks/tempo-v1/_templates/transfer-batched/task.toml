schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo-v1/transfer-batched"
description = "Build a minimal Tempo localnet integration that sends one TIP-20 payment batch to multiple recipients."
authors = []
keywords = ["tempo", "tip20", "batch", "transfer", "localnet", "typescript"]

[metadata]
category = "integration"
feature = "transfer-batched"

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
