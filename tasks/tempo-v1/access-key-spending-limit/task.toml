schema_version = "1.3"

artifacts = ["/app/package.json", "/app/src"]

[task]
name = "tempo-v1/access-key-spending-limit"
description = "Build a Tempo testnet integration that authorizes an access key with a token spending limit and spends through it."
authors = []
keywords = ["tempo", "access-key", "spending-limit", "tip20", "transfer", "testnet", "typescript"]

[metadata]
category = "integration"
feature = "access-key-spending-limit"
benchmark = "tempo-bench-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
environment_mode = "shared"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
TEMPO_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
TEMPO_BENCH_RPC_WAIT_MS = "60000"
TEMPO_BENCH_LOG_WAIT_MS = "30000"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_DECIMALS = "6"
TEMPO_BENCH_CASE = "access-key-spending-limit"
TEMPO_SPENDING_LIMIT = "0.50"
TEMPO_SPENDING_PERIOD = "0"
TEMPO_AMOUNT = "0.21"
TEMPO_OVER_LIMIT_AMOUNT = "0.50"
TEMPO_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
TEMPO_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
