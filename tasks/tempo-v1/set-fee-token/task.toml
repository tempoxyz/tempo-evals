schema_version = "1.3"

artifacts = [{ source = "/app", exclude = ["node_modules"] }, "/logs/agent/trajectory.json"]

[task]
name = "tempo-v1/set-fee-token"
description = "Build a Tempo testnet integration that sets a default fee token."
authors = []
keywords = ["tempo", "fee-token", "testnet", "typescript"]

[metadata]
category = "integration"
feature = "set-fee-token"
benchmark = "stable-bench-v1"
[verifier]
timeout_sec = 300.0
environment_mode = "separate"


[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
STABLE_BENCH_SUBMISSION_TIMEOUT_MS = "180000"
STABLE_BENCH_RPC_WAIT_MS = "60000"
STABLE_BENCH_LOG_WAIT_MS = "30000"
TEMPO_TOKEN = "0x20c0000000000000000000000000000000000001"
TEMPO_RECIPIENT = "0x1111111111111111111111111111111111111111"
TEMPO_DECIMALS = "6"
STABLE_BENCH_CASE = "set-fee-token"
TEMPO_AMOUNT = "0.01"
TEMPO_MEMO = "TEMPO-FEE-TOKEN"
TEMPO_FEE_TOKEN = "0x20c0000000000000000000000000000000000001"
STABLE_BENCH_TURNS_SCORE_CUTOFFS = "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
STABLE_BENCH_TOKENS_SCORE_CUTOFFS = "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"
