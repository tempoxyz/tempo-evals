# Daytona Agent dev job: one-attempt Claude Code smoke run on Daytona DinD for fast remote iteration.
# Keep this config thin. scripts/run-benchmark.ts copies tasks into a temporary
# dereferenced .cache/harbor-daytona/<job>/tasks tree before invoking Harbor.
# Do not materialize task symlinks in tasks/ to fix Daytona upload issues; update
# the runner staging logic instead.
job_name: tempo-bench-agents-daytona-dev-local
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
# run all tasks at once -- callers should filter task names upstream
n_concurrent_trials: 32
quiet: false
environment:
  type: daytona
  force_build: false
  delete: true
  kwargs:
    dind_snapshot: tempo-bench-dind-28-3-3
    connection_pool_maxsize: null
verifier:
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    REWARDKIT_JUDGE: ${REWARDKIT_JUDGE:-anthropic/claude-haiku-4-5}
agents:
  - name: claude-code
    model_name: claude-haiku-4-5
    n_concurrent: 32
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_FORCE_OAUTH: ${CLAUDE_FORCE_OAUTH:-false}
datasets:
  - path: tasks
    task_names:
      - "*-docs"
      - "*-mcp"
