# Shared dataset matrix for job configs.
# scripts/run_benchmark.py injects this file into any generated job config
# whose variant does not declare its own `datasets` (see VARIANTS in
# scripts/run_benchmark.py).
datasets:
  - path: tasks/tempo
    task_names:
      - "*-base"
      - "*-docs"
      - "*-mcp"
  - path: tasks/mpp
    task_names:
      - "server-*"
