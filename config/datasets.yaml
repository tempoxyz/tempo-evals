# Shared dataset matrix for job configs.
# scripts/run_benchmark.py injects this file into any generated job config
# whose variant does not declare its own `datasets` (see
# config/variants.yaml).
datasets:
  - path: tasks/tempo-v1
  - path: tasks/tempo-mcp-v1
  - path: tasks/privy-v1
  - path: tasks/mpp
    task_names:
      - "server-*"
