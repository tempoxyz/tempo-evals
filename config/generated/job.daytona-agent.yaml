# Generated by `npm run sync` from config/job.yaml.j2 and
# config/variants.yaml. Do not edit by hand.
job_name: tempo-bench-agents-daytona-local
jobs_dir: jobs
n_attempts: 3
timeout_multiplier: 1.0
n_concurrent_trials: 32
quiet: false
environment:
  type: daytona
  force_build: false
  delete: true
  kwargs:
    dind_image: docker:28.3.3-dind
    connection_pool_maxsize: null
verifier:
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    REWARDKIT_JUDGE: ${REWARDKIT_JUDGE:-anthropic/claude-haiku-4-5}
agents:
- name: claude-code
  model_name: claude-haiku-4-5
  n_concurrent: 32
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
datasets:
- path: tasks/tempo
  task_names:
  - '*-base'
  - '*-docs'
  - '*-mcp'
- path: tasks/mpp
  task_names:
  - server-*
