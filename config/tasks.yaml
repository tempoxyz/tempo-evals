# Rendered at the <!-- tempobench_sync --> placeholder in every source
# instruction.md when generating tasks.
execution_constraints: |
  ## Execution Constraints

  - `TEMPO_RPC_URL` is already set to the Tempo localnet RPC endpoint (`http://tempo-localnet:8545`).
  - Use that localnet RPC endpoint for all example and self-check commands.
  - Do not hard-code or call public Tempo RPC endpoints such as Moderato/testnet.
  - Do not run live testnet smoke tests; local example checks must use the provided environment variables.

# Generated task profiles (in addition to the implicit base profile). For
# each generated task, `env` and `mcp_servers` are applied to task.toml,
# `instruction` is rendered above the execution constraints at the
# instruction placeholder, and `quality_check` is appended to
# tests/quality/check.py.
profiles:
  - id: docs
    suffix: -docs
    label: docs
    env:
      TEMPO_DOCS_URL: http://tempo-docs:3000/developers
    instruction: |
      ## Tempo Access Profile

      Tempo docs are available through the local docs service at `TEMPO_DOCS_URL` (http://tempo-docs:3000/developers). Use those docs for Tempo-specific APIs and examples. Do not use WebSearch, WebFetch, public docs sites, or public RPC endpoints.
    quality_check: |
      rk.tempo_trajectory_matches(
          r"tempo-docs:3000/developers|/developers/llms\.txt|/developers/llms-full\.txt|/developers/docs/.*\.md|TEMPO_DOCS_URL",
      )
  - id: mcp
    suffix: -mcp
    label: MCP
    mcp_servers:
      - name: tempo
        transport: streamable-http
        url: https://mcp.tempo.xyz
    instruction: |
      ## Tempo Access Profile

      The official Tempo MCP server is configured as `tempo`. Use it if your agent runtime exposes MCP tools; do not use WebSearch, WebFetch, or public RPC endpoints.
    quality_check: |
      rk.tempo_mcp_tool_used("tempo")

mpp:
  # Files copied from shared/mpp into every MPP task by sync.
  shared_files:
    - path: environment/Dockerfile
    - path: solution/package.json
    - path: solution/solve.sh
      executable: true
    - path: solution/tsconfig.json
    - path: tests/reward.toml
    - path: tests/test.sh
      executable: true
    - path: tests/correctness/verify.sh
      executable: true
    - path: tests/quality/check.py
    - path: tests/quality/reward.toml
    - path: tests/support/client_lib.py
    - path: tests/support/oracle_paid_server.ts
    - path: tests/support/verifier_utils.py
  # Task-local files that intentionally diverge from the shared MPP defaults.
  # Sync leaves these alone; the tracked task-local copy is the source of truth.
  task_local_overrides:
    client-access-keys:
      - solution/package.json
    server-hono-charge-pathusd:
      - solution/package.json
    server-mcp-pathusd:
      - solution/package.json
    server-charge-pathusd:
      - tests/quality/reward.toml
