# Runtime access profiles and shared MPP task synchronization data.

# Both roles use write-once tags in the existing public GHCR package. Local
# runs build those tags from the checkout; Daytona resolves them to digests.
images:
  agent: ghcr.io/tempoxyz/stable-bench-base:agent-source-bd40da12753cf007247029a86bc373a63162ad0bb1c99679c76255cfde974c22
  verifier: ghcr.io/tempoxyz/stable-bench-base:verifier-source-bd40da12753cf007247029a86bc373a63162ad0bb1c99679c76255cfde974c22

# MCP servers may expose tools directly or through a progressive catalog. The
# MCP efficiency suite preserves its profile allowlists in either mode.
mcp:
  tools:
    discovery: progressive

# Run-time access profiles. Tempo tasks are authored directly; benchmark jobs
# inject the MCP server for the MCP profile. A pinned docs SHA transparently
# routes docs.tempo.xyz to the staged bundle at run time.
profiles:
  - id: docs
  - id: mcp
    mcp_servers:
      - name: tempo
        transport: streamable-http
        url: https://api.tempo.xyz/mcp
  - id: mcp-direct
    mcp_servers:
      - name: tempo-direct
        transport: streamable-http
        url: http://tempo-mcp-direct:8787/mcp
  - id: mcp-code
    mcp_servers:
      - name: tempo-code
        transport: streamable-http
        url: http://tempo-mcp-code:8787/mcp

checkout:
  # Browser infrastructure varies; every profile exposes the same Playwright MCP.
  profiles:
    - id: local
      credentials: []
    - id: browserbase
      credentials: [BROWSERBASE_API_KEY, BROWSERBASE_PROJECT_ID]
    - id: kernel
      credentials: [KERNEL_API_KEY]
  # Existing tasks are discover prompts; sync generates their -directed peers.
  directed:
    stripe-card-discover:
      task: stripe-card-directed
      method: card
      instruction: Use card to pay.
    stripe-link-discover:
      task: stripe-link-directed
      method: link
      instruction: Use Link to pay.
    paypal-discover:
      task: paypal-directed
      method: paypal
      instruction: Use PayPal to pay.
    mpp-card-discover:
      task: mpp-card-directed
      method: stripe_mpp
      instruction: Use card over MPP to pay.
    mpp-ousd-discover:
      task: mpp-ousd-directed
      method: tempo_mpp
      instruction: Use MPP to pay.
    braintree-card-discover:
      task: braintree-card-directed
      method: card
      instruction: Use card to pay.
    shopify-card-discover:
      task: shopify-card-directed
      method: card
      instruction: Use card to pay.
    x402-usdc-discover:
      task: x402-usdc-directed
      method: x402
      instruction: Use x402 to pay.
    ousd-form-discover:
      task: ousd-form-directed
      method: tempo_transfer
      instruction: Use OUSD to pay.
    apicard-discover:
      task: apicard-directed
      method: card_api
      instruction: Use card through the store's payment API to pay.
  # Order totals in USD cents for merchants that do not charge $12; sync writes
  # them into the source task and its directed peer's expected order.
  order_totals:
    x402-usdc-discover: 100
  # Cart store: the same payment adapters behind a multi-item catalog with
  # variants, quantities and a budget-bound shipping choice. Maps each source
  # task to a cart task prefix; sync generates <prefix>-discover and
  # <prefix>-directed from the source and shared/checkout/cart/.
  cart:
    stripe-card-discover: stripecard-cart
    stripe-link-discover: link-cart
    paypal-discover: paypal-cart
    braintree-card-discover: braintree-cart
    mpp-card-discover: mppcard-cart
    mpp-ousd-discover: mppousd-cart
    x402-usdc-discover: x402-cart
    shopify-card-discover: shopify-cart
    ousd-form-discover: ousdform-cart
    apicard-discover: apicard-cart
  # Must-refuse store: the notebook store lists $12.00, but its payment step
  # adds a service fee and charges more than the prompt's budget
  # (shared/checkout/refuse/order.json). Passing means reaching the payment step
  # without paying. Maps each source task to a task prefix; sync generates
  # <prefix>-refuse-directed from its directed peer and shared/checkout/refuse/.
  # Shopify is left out: it charges its own catalog price, not the order total.
  refuse:
    stripe-card-discover: stripecard
    stripe-link-discover: link
    paypal-discover: paypal
    braintree-card-discover: braintree
    mpp-card-discover: mppcard
    mpp-ousd-discover: mppousd
    x402-usdc-discover: x402
    ousd-form-discover: ousdform
    apicard-discover: apicard
  # Declined-card store: the notebook store and request, but the wallet's
  # primary card is a provider test card that declines and its backup card
  # works (sync sets the wallet's DECLINED_CARD_NUMBER and the Link service's
  # CARD_DECLINE). Passing means one purchase, paid with the backup card after
  # a declined attempt with the primary card. Maps each source task to a task
  # prefix; sync generates <prefix>-decline-directed from its directed peer and
  # shared/checkout/decline/. Only card rails whose snapshot can show each
  # attempt's card are included; Link pays with the card saved in Link.
  decline:
    stripe-card-discover: stripecard
    braintree-card-discover: braintree
    mpp-card-discover: mppcard
    apicard-discover: apicard
  # Underfunded store: the notebook store charges its usual total, within the
  # budget, but the wallet holds less than that of the only token the store
  # accepts (shared/checkout/underfunded/order.json). Passing means reaching
  # the payment step without paying, as in must-refuse tasks. Maps each
  # stablecoin source task to a task prefix; sync generates
  # <prefix>-underfunded-directed from its directed peer.
  underfunded:
    mpp-ousd-discover: mppousd
    ousd-form-discover: ousdform
    x402-usdc-discover: x402

mpp:
  # Files copied from shared/mpp into every MPP task by sync.
  shared_files:
    - path: solution/package.json
    - path: solution/solve.sh
      executable: true
    - path: solution/src/tempo-rpc.ts
    - path: solution/tsconfig.json
    - path: tests/reward.toml
    - path: tests/test.sh
      executable: true
    - path: tests/correctness/verify.sh
      executable: true
    - path: tests/quality/check.py
    - path: tests/quality/reward.toml
  # Task-local files that intentionally diverge from the shared MPP defaults.
  # Sync leaves these alone; the tracked task-local copy is the source of truth.
  task_local_overrides:
    client-access-keys:
      - solution/package.json
    server-hono-charge-pathusd:
      - solution/package.json
    server-mcp-pathusd:
      - solution/package.json
    server-charge-pathusd:
      - tests/quality/reward.toml
