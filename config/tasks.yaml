# Data for npm run sync: which Tempo task templates get generated into
# base/docs/MCP variants, the per-profile task.toml/instruction/quality
# edits, and the shared files synced into MPP tasks.

# Authored task templates under tasks/tempo/_templates/<slug>/. Each one
# generates a -base, -docs, and -mcp task under tasks/tempo/.
task_slugs:
  - transfer-with-memo
  - transfer-with-memo-fee-payer
  - set-fee-token
  - create-stablecoin-with-policy
  - faucet-funded-transfer
  - stablecoin-dex-swap

# Added to every task's [environment.env] when the keys are missing.
quality_env:
  TEMPO_BENCH_TURNS_SCORE_CUTOFFS: "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
  TEMPO_BENCH_TOKENS_SCORE_CUTOFFS: "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"

