# Runtime access profiles and shared MPP task synchronization data.

# Shared base image for every task environment. It bakes in the RewardKit
# venv (harbor-rewardkit, pympp[tempo], tempo-bench-rewardkit) and the Tempo
# JS verifier; see shared/global/docker/base/Dockerfile. CI publishes it via
# .github/workflows/build-base-image.yml; local runs build it automatically.
# This tag is intentionally mutable during a Tempo Bench version. Only bump it
# when cutting a new Tempo Bench version; ordinary shared-base changes replace
# the image at the existing tag.
base_image: ghcr.io/tempoxyz/tempo-bench-base:v1

# Run-time access profiles. Tempo tasks are authored directly; benchmark jobs
# either route docs.tempo.xyz to the pinned bundle or inject the live docs MCP.
profiles:
  - id: docs
  - id: mcp
    mcp_servers:
      - name: tempo
        transport: streamable-http
        url: https://mcp.tempo.xyz/
  - id: mcp-direct
    mcp_servers:
      - name: tempo-direct
        transport: streamable-http
        url: http://tempo-mcp-direct:8787/mcp
  - id: mcp-code
    mcp_servers:
      - name: tempo-code
        transport: streamable-http
        url: http://tempo-mcp-code:8787/mcp

mpp:
  # Files copied from shared/mpp into every MPP task by sync.
  shared_files:
    - path: solution/package.json
    - path: solution/solve.sh
      executable: true
    - path: solution/tsconfig.json
    - path: tests/reward.toml
    - path: tests/test.sh
      executable: true
    - path: tests/correctness/verify.sh
      executable: true
    - path: tests/quality/check.py
    - path: tests/quality/reward.toml
  # Task-local files that intentionally diverge from the shared MPP defaults.
  # Sync leaves these alone; the tracked task-local copy is the source of truth.
  task_local_overrides:
    client-access-keys:
      - solution/package.json
    server-hono-charge-pathusd:
      - solution/package.json
    server-mcp-pathusd:
      - solution/package.json
    server-charge-pathusd:
      - tests/quality/reward.toml
