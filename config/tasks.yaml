# Data for npm run sync: which Tempo task templates get generated into
# docs/MCP variants, the per-profile task.toml/instruction edits, and the
# shared files synced into MPP tasks.

# Shared base image for every task environment. It bakes in the RewardKit
# venv (harbor-rewardkit, pympp[tempo], tempo-bench-rewardkit) and the Tempo
# JS verifier; see shared/global/docker/base/Dockerfile. CI publishes it via
# .github/workflows/build-base-image.yml; local runs build it automatically.
base_image: ghcr.io/tempoxyz/tempo-bench-base:v1

# Authored task templates under tasks/tempo-v1/_templates/<slug>/. Each one
# generates a task without a suffix and a -mcp task under tasks/tempo-v1/.
task_slugs:
  - transfer-with-memo
  - transfer-with-memo-fee-payer
  - set-fee-token
  - create-stablecoin-with-policy
  - faucet-funded-transfer
  - stablecoin-dex-swap

# Added to every task's [environment.env] when the keys are missing.
quality_env:
  TEMPO_BENCH_TURNS_SCORE_CUTOFFS: "20=1.0,40=0.8,60=0.5,80=0.2,*=0.0"
  TEMPO_BENCH_TOKENS_SCORE_CUTOFFS: "250000=1.0,500000=0.8,1000000=0.5,1500000=0.2,*=0.0"

# Shared Tempo localnet fixture values merged into every generated task's
# [environment.env]. Per-task overrides live in case_fixtures below.
fixture_env:
  TEMPO_BENCH_SUBMISSION_TIMEOUT_MS: "180000"
  TEMPO_BENCH_RPC_WAIT_MS: "60000"
  TEMPO_BENCH_LOG_WAIT_MS: "30000"
  TEMPO_RPC_URL: "http://tempo-localnet:8545"
  TEMPO_TOKEN: "0x20c0000000000000000000000000000000000001"
  TEMPO_PAYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  TEMPO_RECIPIENT: "0x1111111111111111111111111111111111111111"
  TEMPO_DECIMALS: "6"

# Per-template fixture overrides keyed by tasks/tempo-v1/_templates/<slug>/.
case_fixtures:
  transfer-with-memo:
    TEMPO_BENCH_CASE: "transfer-with-memo"
    TEMPO_AMOUNT: "0.17"
    TEMPO_MEMO: "TEMPO-EVAL-001"
  transfer-with-memo-fee-payer:
    TEMPO_BENCH_CASE: "transfer-with-memo"
    TEMPO_AMOUNT: "0.19"
    TEMPO_MEMO: "TEMPO-FEEPAYER-001"
    TEMPO_FEE_TOKEN: "0x20c0000000000000000000000000000000000001"
    TEMPO_FEE_PAYER_PRIVATE_KEY: "0x59c6995e998f97a5a004497e5da46f94a879b621718eb9bde6e3db6c2b2b3b4d"
  set-fee-token:
    TEMPO_BENCH_CASE: "set-fee-token"
    TEMPO_AMOUNT: "0.01"
    TEMPO_MEMO: "TEMPO-FEE-TOKEN"
    TEMPO_FEE_TOKEN: "0x20c0000000000000000000000000000000000001"
  create-stablecoin-with-policy:
    TEMPO_BENCH_CASE: "create-stablecoin-with-policy"
    TEMPO_AMOUNT: "0.01"
    TEMPO_MEMO: "TEMPO-STABLECOIN"
    TEMPO_STABLECOIN_NAME: "Tempo Bench Policy USD"
    TEMPO_STABLECOIN_SYMBOL: "TBPUSD"
    TEMPO_STABLECOIN_CURRENCY: "USD"
    TEMPO_POLICY_TYPE: "blacklist"
    TEMPO_POLICY_ACCOUNT: "0x1111111111111111111111111111111111111111"
  faucet-funded-transfer:
    TEMPO_BENCH_CASE: "faucet-funded-transfer"
    TEMPO_AMOUNT: "0.23"
    TEMPO_MEMO: "TEMPO-FAUCET"
    TEMPO_FAUCET_PRIVATE_KEY: "0x59c6995e998f97a5a004497e5da46f94a879b621718eb9bde6e3db6c2b2b3b4d"
  stablecoin-dex-swap:
    TEMPO_BENCH_CASE: "stablecoin-dex-swap"
    TEMPO_AMOUNT: "100"
    TEMPO_MEMO: "TEMPO-DEX"
    TEMPO_STABLECOIN_DEX: "0xdec0000000000000000000000000000000000000"
    TEMPO_DEX_MAKER_PRIVATE_KEY: "0x59c6995e998f97a5a004497e5da46f94a879b621718eb9bde6e3db6c2b2b3b4d"
    TEMPO_SWAP_TOKEN_IN: "0x20c0000000000000000000000000000000000000"
    TEMPO_SWAP_TOKEN_OUT: "0x20c0000000000000000000000000000000000001"
    TEMPO_SWAP_AMOUNT_IN: "100"
    TEMPO_SWAP_MIN_AMOUNT_OUT: "0"

# Rendered at the <!-- tempobench_sync --> placeholder in every source
# instruction.md when generating tasks.
execution_constraints: |
  ## Execution Constraints

  - `TEMPO_RPC_URL` is already set to the Tempo localnet RPC endpoint (`http://tempo-localnet:8545`).
  - Use that localnet RPC endpoint for all eval and self-check commands.
  - Do not hard-code or call public Tempo RPC endpoints such as Moderato/testnet.
  - Do not run live testnet smoke tests; local eval checks must use the provided environment variables.

# Generated task profiles. For each generated task, `mcp_servers` is applied
# to task.toml and `instruction` is rendered above the execution constraints.
# A pinned docs SHA transparently routes docs.tempo.xyz to the staged bundle at
# run time; generated tasks default to public docs.
profiles:
  - id: docs
    suffix: ""
    label: docs
    instruction: |
      ## Tempo Documentation

      Tempo documentation is available publicly at https://docs.tempo.xyz. Use it for Tempo-specific APIs and examples.
  - id: mcp
    suffix: -mcp
    label: MCP
    mcp_servers:
      - name: tempo
        transport: streamable-http
        url: https://mcp.tempo.xyz
    instruction: |
      ## Tempo Documentation

      Tempo documentation is available publicly at https://docs.tempo.xyz. Use it for Tempo-specific APIs and examples.

      ## Tempo MCP

      The official Tempo MCP server is configured as `tempo` and is available in addition to the documentation.

mpp:
  # Files copied from shared/mpp into every MPP task by sync.
  shared_files:
    - path: solution/package.json
    - path: solution/solve.sh
      executable: true
    - path: solution/tsconfig.json
    - path: tests/reward.toml
    - path: tests/test.sh
      executable: true
    - path: tests/correctness/verify.sh
      executable: true
    - path: tests/quality/check.py
    - path: tests/quality/reward.toml
  # Task-local files that intentionally diverge from the shared MPP defaults.
  # Sync leaves these alone; the tracked task-local copy is the source of truth.
  task_local_overrides:
    client-access-keys:
      - solution/package.json
    server-hono-charge-pathusd:
      - solution/package.json
    server-mcp-pathusd:
      - solution/package.json
    server-charge-pathusd:
      - tests/quality/reward.toml
