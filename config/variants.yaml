# Data for scripts/run_benchmark.py: everything that differs between the
# generated Harbor job configs, plus shared Daytona runner settings. The rest
# of each job config (verifier env, timeout multiplier, Daytona kwargs, ...)
# lives in config/job.yaml.j2. Omit `datasets` to use the config/datasets.yaml
# matrix. `npm run sync` compiles each `job` spec into config/generated/, and
# runs use those checked-in files.

daytona:
  # Image and snapshot used by Daytona job environments. After changing the
  # image, run scripts/create-daytona-dind-snapshot.py to create the snapshot.
  dind_image: docker:28.3.3-dind
  dind_snapshot_name: tempo-bench-dind-28-3-3

# Dataset scopes for explicit benchmark entrypoints. Commands default to Tempo;
# use --task-suite all to include every task family.
tempo_only_datasets: &tempo_only_datasets
  - path: tasks/tempo-v1
mcp_only_datasets: &mcp_only_datasets
  - path: tasks/tempo-mcp-v1
mpp_only_datasets: &mpp_only_datasets
  - path: tasks/mpp
    task_names: ["server-*"]
privy_only_datasets: &privy_only_datasets
  - path: tasks/privy-v1

# Shared blocks referenced by the variants below.
defaults:
  oracle_agent: &oracle_agent
    name: oracle
  claude_agent: &claude_agent
    name: claude-code
    model_name: claude-haiku-4-5
  local_job: &local_job
    n_attempts: 1
    n_concurrent_trials: 4
    environment_type: docker
    force_build: true
  daytona_job: &daytona_job
    n_attempts: 1
    n_concurrent_trials: 32
    environment_type: daytona
    force_build: false

variants:
  local-oracle:
    benchmark: tempo
    prefix: oracle-local
    job:
      <<: *local_job
      job_name: local
      datasets: *tempo_only_datasets
      agents:
        - *oracle_agent
  local-oracle-dev:
    benchmark: tempo
    prefix: oracle-dev-local
    job:
      <<: *local_job
      job_name: local-dev
      n_concurrent_trials: 1
      force_build: false
      datasets: *tempo_only_datasets
      agents:
        - *oracle_agent
  local-agent:
    benchmark: tempo
    prefix: agents-local
    needs_agent_auth: true
    job:
      <<: *local_job
      job_name: agents-local
      n_attempts: 3
      datasets: *tempo_only_datasets
      agents:
        - *claude_agent
  local-agent-dev:
    benchmark: tempo
    prefix: agents-dev-local
    needs_agent_auth: true
    job:
      <<: *local_job
      job_name: agents-dev-local
      datasets: *tempo_only_datasets
      agents:
        - *claude_agent
  model:
    benchmark: tempo
    prefix: model-local
    path: tasks/tempo-v1
    default_agent: claude-code
    default_model: haiku
    needs_agent_auth: true
  daytona-oracle:
    benchmark: tempo
    prefix: oracle-daytona
    needs_daytona_auth: true
    job:
      <<: *daytona_job
      job_name: oracle-daytona
      datasets: *tempo_only_datasets
      agents:
        - *oracle_agent
  daytona-agent:
    benchmark: tempo
    prefix: agents-daytona
    needs_agent_auth: true
    needs_daytona_auth: true
    job:
      <<: *daytona_job
      job_name: agents-daytona-local
      n_attempts: 3
      datasets: *tempo_only_datasets
      agents:
        - <<: *claude_agent
          n_concurrent: 32
  daytona-agent-dev:
    benchmark: tempo
    prefix: agents-daytona-dev
    needs_agent_auth: true
    needs_daytona_auth: true
    job:
      <<: *daytona_job
      job_name: agents-daytona-dev-local
      datasets: *tempo_only_datasets
      agents:
        - <<: *claude_agent
          n_concurrent: 32
  production-daytona:
    benchmark: tempo
    prefix: production
    needs_agent_auth: true
    needs_daytona_auth: true
    production: true
