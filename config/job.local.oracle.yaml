# Local Oracle job: validates task variants with oracle solutions in local Docker.
job_name: tempo-bench-local
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 4
quiet: false
environment:
  type: docker
  force_build: true
  delete: true
verifier:
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    REWARDKIT_JUDGE: ${REWARDKIT_JUDGE:-anthropic/claude-haiku-4-5}
agents:
  - name: oracle
# Datasets are injected from config/datasets.yaml; declare `datasets:` here to override.
